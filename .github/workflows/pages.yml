name: Deploy PeerDrop website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          WINDOW_APPLICATION: ${{ secrets.WINDOW_APPLICATION }}
          ANDROID_APPLICATION: ${{ secrets.ANDROID_APPLICATION }}
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          node <<'NODE'
          const fs = require('fs');
          const config = {
            windows: process.env.WINDOW_APPLICATION || '',
            android: process.env.ANDROID_APPLICATION || ''
          };
          fs.writeFileSync('_site/download-config.js', `window.PEERDROP_DOWNLOADS = ${JSON.stringify(config)};\n`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
